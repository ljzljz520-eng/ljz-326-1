<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理端 · 星尘公会招募站</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin">
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-logo"></span>
      <span class="brand-text">星尘公会<small>ADMIN CONSOLE</small></span>
    </a>
    <div class="top-actions">
      <a class="px-btn tiny ghost" href="/">← 返回招募页</a>
      <button class="px-btn tiny danger" id="logoutBtn" hidden>退出登录</button>
    </div>
  </header>

  <main class="admin-main">
    <!-- 登录 -->
    <section id="loginView" class="login-wrap">
      <div class="px-panel login-card">
        <h1 class="login-title">◆ 管理端登录 ◆</h1>
        <p class="login-sub">GUILD OFFICER ONLY</p>
        <form id="loginForm">
          <label class="field-label" for="pw">▸ 管理密码</label>
          <input class="px-input" type="password" id="pw" autocomplete="current-password" placeholder="请输入管理密码">
          <p class="field-err" id="loginErr"></p>
          <button class="px-btn btn-block" type="submit" id="loginBtn">▶ 进入管理端</button>
        </form>
        <p class="login-hint">密码见服务器启动日志，或 data/admin-secret.json</p>
      </div>
    </section>

    <!-- 审核台 -->
    <section id="dashView" hidden>
      <div class="sec-title"><span class="sec-en">REVIEW CONSOLE</span><h2>申请审核</h2></div>
      <div class="stat-grid admin-stats">
        <div class="stat-card px-panel"><span class="stat-num" id="stPending">0</span><span class="stat-label">待审核</span><span class="stat-en">PENDING</span></div>
        <div class="stat-card px-panel"><span class="stat-num" id="stApproved">0</span><span class="stat-label">已通过</span><span class="stat-en">APPROVED</span></div>
        <div class="stat-card px-panel"><span class="stat-num" id="stRejected">0</span><span class="stat-label">已拒绝</span><span class="stat-en">REJECTED</span></div>
        <div class="stat-card px-panel"><span class="stat-num" id="stTotal">0</span><span class="stat-label">累计申请</span><span class="stat-en">TOTAL</span></div>
      </div>
      <div class="filter-bar">
        <div class="tabs" id="tabs" role="tablist">
          <button data-f="pending" class="tab active" role="tab">待审核</button>
          <button data-f="approved" class="tab" role="tab">已通过</button>
          <button data-f="rejected" class="tab" role="tab">已拒绝</button>
          <button data-f="all" class="tab" role="tab">全部</button>
        </div>
        <button class="px-btn tiny ghost" id="refreshBtn">↻ 刷新</button>
      </div>
      <div id="appList" class="app-list"></div>
      <p class="empty-hint" id="emptyHint" hidden>（这里空空如也，去喝杯药水吧）</p>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/sprites.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
